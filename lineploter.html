<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EXIF Photo Plotter with Road Paths</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            background-color: #f5f6f7;
        }

        .main {
            width: 95%;
            margin: 20px auto;
        }

        .main-card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
        }

        .card-header {
            padding: 15px 20px;
        }

        /* Upload section */

        .upload-section {
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .upload-button {
            margin-top: 20px;
        }

        .upload-button i {
            margin-right: 5px;
        }

        /* Loading */

        .loading-spinner {
            display: none;
            margin-top: 15px;
            text-align: center;
        }

        .loading-spinner .spinner-border {
            width: 1.5rem;
            height: 1.5rem;
        }

        /* Information */

        .info-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }

        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }

        /* Photo gallery */

        #photoCards {
            max-height: 500px;
            overflow-y: auto;
            margin-top: 10px;
            padding: 5px;
        }

        .photo-card {
            cursor: pointer;
            margin-bottom: 10px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            background: white;
            overflow: hidden;
            transition: 0.2s;
        }

        .photo-card:hover {
            border-color: #86b7fe;
            background-color: #f8f9fa;
        }

        .photo-card.active {
            border-color: #0d6efd;
            background-color: #e9f2ff;
        }

        .photo-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .photo-card-content {
            padding: 10px;
        }

        .photo-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .photo-info {
            font-size: 12px;
            color: #6c757d;
        }

        /* Map */

        #map {
            width: 100%;
            height: 550px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
        }

        /* Buttons */

        .map-controls {
            margin-bottom: 10px;
        }

        /* Empty state */

        .empty-gallery {
            text-align: center;
            color: #6c757d;
            padding: 30px 10px;
        }

        /* Mobile */

        @media (max-width: 767px) {

            .main {
                width: 100%;
                margin: 0;
            }

            .main-card {
                border-radius: 0;
            }

            #map {
                height: 450px;
            }

            .photo-card img {
                height: 100px;
            }

        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card main-card shadow-sm">

            <!-- HEADER -->

            <div class="card-header bg-white">

                <h5 class="mb-1">
                    <i class="bi bi-geo-alt"></i>
                    EXIF Photo Plotter
                </h5>

                <small class="text-muted">
                    Upload geotagged photos to plot their GPS locations and generate a road path.
                </small>

            </div>


            <div class="card-body">

                <div class="row g-4">

                    <!-- ================================================= -->
                    <!-- LEFT SIDE -->
                    <!-- ================================================= -->

                    <div class="col-md-4">

                        <!-- Upload -->

                        <div class="upload-section">

                            <input type="file" id="imageInput" class="d-none" multiple accept="image/*">

                            <label for="imageInput" class="btn btn-primary upload-button">

                                <i class="bi bi-plus-lg"></i>

                                Add Images

                            </label>


                            <!-- Loading -->

                            <div class="loading-spinner" id="loadingSpinner">

                                <div class="spinner-border text-primary" role="status">

                                    <span class="visually-hidden">
                                        Loading...
                                    </span>

                                </div>

                                <div class="mt-2">

                                    Processing photos...

                                </div>

                            </div>

                        </div>


                        <!-- Status -->

                        <div id="statusMessage" class="alert alert-info d-none"></div>


                        <!-- Distance -->

                        <div id="pathInfo" class="info-box" style="display: none;">

                            <strong>
                                <i class="bi bi-signpost"></i>
                                Total Distance
                            </strong>

                            <span id="totalDistance">
                                0 km
                            </span>

                        </div>


                        <!-- Time -->

                        <div id="timeInfo" class="info-box" style="display: none;">

                            <strong>
                                <i class="bi bi-clock"></i>
                                Time Between Photos
                            </strong>

                            <div id="timeDifference">
                                N/A
                            </div>

                        </div>


                        <!-- Gallery -->

                        <div class="mt-4">

                            <div class="d-flex justify-content-between align-items-center">

                                <h6 class="mb-0">
                                    Photo Gallery
                                </h6>

                                <span id="photoCount" class="badge text-bg-secondary">
                                    0
                                </span>

                            </div>


                            <div id="photoCards">

                                <div class="empty-gallery">

                                    <i class="bi bi-images fs-2"></i>

                                    <div class="mt-2">
                                        No photos uploaded
                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- ================================================= -->
                    <!-- RIGHT SIDE -->
                    <!-- ================================================= -->

                    <div class="col-md-8">

                        <!-- Map controls -->

                        <div class="map-controls d-flex justify-content-between">

                            <div>

                                <button id="fitButton" class="btn btn-outline-primary btn-sm" type="button">

                                    <i class="bi bi-arrows-fullscreen"></i>

                                    Fit Photos

                                </button>

                            </div>


                            <button id="clearButton" class="btn btn-outline-danger btn-sm" type="button">

                                <i class="bi bi-trash"></i>

                                Clear Map

                            </button>

                        </div>


                        <!-- MAP -->

                        <div id="map"></div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script>

        /* ============================================================
           GLOBAL VARIABLES
        ============================================================ */

        let myMap;

        let markers = [];

        let photoData = [];

        let pathPolyline = null;

        let totalDistance = 0;


        /* ============================================================
           DOM ELEMENTS
        ============================================================ */

        const imageInput =
            document.getElementById("imageInput");

        const loadingSpinner =
            document.getElementById("loadingSpinner");

        const photoCards =
            document.getElementById("photoCards");

        const pathInfo =
            document.getElementById("pathInfo");

        const timeInfo =
            document.getElementById("timeInfo");

        const totalDistanceElement =
            document.getElementById("totalDistance");

        const timeDifferenceElement =
            document.getElementById("timeDifference");

        const photoCount =
            document.getElementById("photoCount");

        const statusMessage =
            document.getElementById("statusMessage");


        /* ============================================================
           INITIALIZE MAP
        ============================================================ */

        function initMap() {

            /*
                Default map location.
        
                You can change this to your
                reforestation area later.
            */

            myMap = L.map("map").setView(
                [8.3536, 124.8695],
                13
            );


            /*
                OpenStreetMap tiles
            */

            L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {

                    maxZoom: 19,

                    attribution:
                        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'

                }

            ).addTo(myMap);


            console.log("Map initialized.");

        }


        /* ============================================================
           FILE INPUT EVENT
        ============================================================ */

        imageInput.addEventListener(
            "change",
            function () {

                handleImageInput(this);

            }
        );


        /* ============================================================
           HANDLE IMAGE UPLOAD
        ============================================================ */

        async function handleImageInput(input) {

            if (!input.files || input.files.length === 0) {

                return;

            }


            /*
                Show loading
            */

            loadingSpinner.style.display = "block";

            hideStatus();


            /*
                We don't clear existing photos.
        
                This allows the user to add
                more photos later.
            */

            let processedCount = 0;

            let skippedCount = 0;


            try {

                for (
                    let i = 0;
                    i < input.files.length;
                    i++
                ) {

                    const file =
                        input.files[i];


                    console.log(
                        "Processing:",
                        file.name
                    );


                    const result =
                        await processImageFile(file);


                    if (result === true) {

                        processedCount++;

                    } else {

                        skippedCount++;

                    }

                }


                /*
                    Update gallery
                */

                updatePhotoCards();


                /*
                    Draw route
                */

                await drawPaths();


                /*
                    Update time information
                */

                updateTimeDifferences();


                /*
                    Status
                */

                if (
                    processedCount > 0 &&
                    skippedCount === 0
                ) {

                    showStatus(
                        `${processedCount} photo(s) successfully added.`,
                        "success"
                    );

                } else if (
                    processedCount > 0 &&
                    skippedCount > 0
                ) {

                    showStatus(
                        `${processedCount} photo(s) added. ${skippedCount} photo(s) skipped because GPS data was missing.`,
                        "warning"
                    );

                } else {

                    showStatus(
                        "No photos were added. Make sure the images contain GPS EXIF metadata.",
                        "warning"
                    );

                }


            } catch (error) {

                console.error(
                    "Upload error:",
                    error
                );


                showStatus(
                    "An unexpected error occurred while processing the photos.",
                    "danger"
                );

            } finally {

                /*
                    IMPORTANT:
        
                    This always hides the spinner,
                    even when an error occurs.
                */

                loadingSpinner.style.display = "none";


                /*
                    Reset file input.
        
                    This allows the user to select
                    the same image again.
                */

                input.value = "";

            }

        }


        /* ============================================================
           PROCESS SINGLE IMAGE
        ============================================================ */

        async function processImageFile(file) {

            return new Promise((resolve) => {

                const reader =
                    new FileReader();


                /*
                    File successfully loaded
                */

                reader.onload = function (e) {

                    try {

                        EXIF.getData(
                            file,
                            function () {

                                try {

                                    /*
                                        Get GPS EXIF
                                    */

                                    const lat =
                                        EXIF.getTag(
                                            this,
                                            "GPSLatitude"
                                        );

                                    const lon =
                                        EXIF.getTag(
                                            this,
                                            "GPSLongitude"
                                        );


                                    /*
                                        GPS references
                                    */

                                    const latRef =
                                        EXIF.getTag(
                                            this,
                                            "GPSLatitudeRef"
                                        ) || "N";


                                    const lonRef =
                                        EXIF.getTag(
                                            this,
                                            "GPSLongitudeRef"
                                        ) || "E";


                                    /*
                                        If GPS doesn't exist,
                                        skip the image.
                                    */

                                    if (
                                        !lat ||
                                        !lon ||
                                        lat.length < 3 ||
                                        lon.length < 3
                                    ) {

                                        console.warn(
                                            `${file.name}: GPS data not found.`
                                        );

                                        resolve(false);

                                        return;

                                    }


                                    /*
                                        Convert DMS
                                        to decimal
                                    */

                                    const calculatedLat =
                                        convertDMSToDecimal(
                                            lat,
                                            latRef
                                        );


                                    const calculatedLon =
                                        convertDMSToDecimal(
                                            lon,
                                            lonRef
                                        );


                                    /*
                                        Validate coordinates
                                    */

                                    if (
                                        !isFinite(calculatedLat) ||
                                        !isFinite(calculatedLon)
                                    ) {

                                        console.warn(
                                            `${file.name}: Invalid GPS coordinates.`
                                        );

                                        resolve(false);

                                        return;

                                    }


                                    /*
                                        Get date
                                    */

                                    const date =
                                        EXIF.getTag(
                                            this,
                                            "DateTimeOriginal"
                                        );


                                    /*
                                        Camera information
                                    */

                                    const make =
                                        EXIF.getTag(
                                            this,
                                            "Make"
                                        ) || "Unknown";


                                    const model =
                                        EXIF.getTag(
                                            this,
                                            "Model"
                                        ) || "Unknown";


                                    /*
                                        Parse date
                                    */

                                    let dateObj = null;

                                    let formattedDate =
                                        "Unknown date";


                                    if (date) {

                                        try {

                                            const parts =
                                                date.split(" ");


                                            if (
                                                parts.length >= 2
                                            ) {

                                                const dateString =
                                                    parts[0]
                                                        .replace(
                                                            /:/g,
                                                            "-"
                                                        )
                                                    +
                                                    "T"
                                                    +
                                                    parts[1];


                                                dateObj =
                                                    new Date(
                                                        dateString
                                                    );


                                                if (
                                                    !isNaN(
                                                        dateObj.getTime()
                                                    )
                                                ) {

                                                    formattedDate =
                                                        dateObj.toLocaleString();

                                                } else {

                                                    formattedDate =
                                                        date;

                                                }

                                            } else {

                                                formattedDate =
                                                    date;

                                            }

                                        } catch (error) {

                                            console.warn(
                                                "Date parsing error:",
                                                error
                                            );

                                            formattedDate =
                                                date;

                                        }

                                    }


                                    /*
                                        Create photo object
                                    */

                                    const photo = {

                                        id:
                                            Date.now()
                                            +
                                            Math.random()
                                                .toString(36)
                                                .substring(2, 9),

                                        file: file,

                                        src: e.target.result,

                                        lat:
                                            calculatedLat,

                                        lon:
                                            calculatedLon,

                                        date:
                                            date,

                                        dateObj:
                                            dateObj,

                                        formattedDate:
                                            formattedDate,

                                        make:
                                            make,

                                        model:
                                            model,

                                        filename:
                                            file.name

                                    };


                                    /*
                                        Store photo
                                    */

                                    photoData.push(
                                        photo
                                    );


                                    console.log(
                                        "Photo added:",
                                        photo
                                    );


                                    resolve(true);

                                } catch (error) {

                                    console.error(
                                        `EXIF error for ${file.name}:`,
                                        error
                                    );

                                    resolve(false);

                                }

                            }
                        );


                    } catch (error) {

                        console.error(
                            `Error reading EXIF from ${file.name}:`,
                            error
                        );

                        resolve(false);

                    }

                };


                /*
                    File reading error
                */

                reader.onerror = function (error) {

                    console.error(
                        `FileReader error for ${file.name}:`,
                        error
                    );

                    resolve(false);

                };


                /*
                    Start reading
                */

                reader.readAsDataURL(file);

            });

        }


        /* ============================================================
           CONVERT GPS DMS TO DECIMAL
        ============================================================ */

        function convertDMSToDecimal(
            dms,
            reference
        ) {

            const degrees =
                Number(dms[0]);


            const minutes =
                Number(dms[1]);


            const seconds =
                Number(dms[2]);


            let decimal =
                degrees
                +
                minutes / 60
                +
                seconds / 3600;


            /*
                South and West are negative.
            */

            if (
                reference === "S" ||
                reference === "W"
            ) {

                decimal *= -1;

            }


            return decimal;

        }


        /* ============================================================
           UPDATE PHOTO GALLERY
        ============================================================ */

        function updatePhotoCards() {

            photoCards.innerHTML = "";


            photoCount.textContent =
                photoData.length;


            if (photoData.length === 0) {

                photoCards.innerHTML = `

            <div class="empty-gallery">

                <i class="bi bi-images fs-2"></i>

                <div class="mt-2">
                    No photos uploaded
                </div>

            </div>

        `;

                return;

            }


            /*
                Sort photos by date
            */

            const sortedPhotos =
                [...photoData].sort(
                    (a, b) => {

                        if (
                            a.dateObj &&
                            b.dateObj
                        ) {

                            return (
                                a.dateObj -
                                b.dateObj
                            );

                        }

                        return 0;

                    }
                );


            sortedPhotos.forEach(
                (photo, index) => {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "photo-card";


                    card.dataset.photoId =
                        photo.id;


                    card.innerHTML = `

                <div class="row g-0">

                    <div class="col-5">

                        <img
                            src="${photo.src}"
                            alt="${escapeHtml(photo.filename)}"
                        >

                    </div>


                    <div class="col-7">

                        <div class="photo-card-content">

                            <div class="photo-title">

                                ${escapeHtml(photo.filename)}

                            </div>


                            <div class="photo-info">

                                <strong>Date:</strong><br>

                                ${escapeHtml(photo.formattedDate)}

                                <br><br>

                                <strong>GPS:</strong><br>

                                ${photo.lat.toFixed(6)},
                                ${photo.lon.toFixed(6)}

                            </div>

                        </div>

                    </div>

                </div>

            `;


                    /*
                        Click card
                    */

                    card.addEventListener(
                        "click",
                        function () {

                            focusOnPhoto(
                                photo.id,
                                card
                            );

                        }
                    );


                    photoCards.appendChild(
                        card
                    );

                }
            );

        }


        /* ============================================================
           FOCUS ON PHOTO
        ============================================================ */

        function focusOnPhoto(
            photoId,
            cardElement
        ) {

            const photo =
                photoData.find(
                    p => p.id === photoId
                );


            if (!photo) {

                return;

            }


            /*
                Remove active state
                from all cards.
            */

            document
                .querySelectorAll(
                    ".photo-card"
                )
                .forEach(
                    card => {

                        card.classList.remove(
                            "active"
                        );

                    }
                );


            /*
                Activate selected card
            */

            cardElement.classList.add(
                "active"
            );


            /*
                Move map
            */

            myMap.setView(
                [
                    photo.lat,
                    photo.lon
                ],
                17
            );


            /*
                Find marker
            */

            const marker =
                markers.find(
                    m =>
                        m.photoId ===
                        photoId
                );


            /*
                Open popup
            */

            if (marker) {

                marker.openPopup();

            }

        }


        /* ============================================================
           DRAW PATHS
        ============================================================ */

        async function drawPaths() {

            /*
                Remove old markers
            */

            markers.forEach(
                marker => {

                    myMap.removeLayer(
                        marker
                    );

                }
            );


            markers = [];


            /*
                Remove old route
            */

            if (pathPolyline) {

                myMap.removeLayer(
                    pathPolyline
                );

                pathPolyline = null;

            }


            /*
                No photos
            */

            if (
                photoData.length === 0
            ) {

                pathInfo.style.display =
                    "none";

                return;

            }


            /*
                Sort by date
            */

            const sortedPhotos =
                [...photoData].sort(
                    (a, b) => {

                        if (
                            a.dateObj &&
                            b.dateObj
                        ) {

                            return (
                                a.dateObj -
                                b.dateObj
                            );

                        }

                        return 0;

                    }
                );


            /*
                Create markers
            */

            sortedPhotos.forEach(
                (photo, index) => {

                    const marker =
                        L.marker(
                            [
                                photo.lat,
                                photo.lon
                            ]
                        )
                            .addTo(myMap);


                    /*
                        Popup
                    */

                    marker.bindPopup(`

                <div style="min-width:220px">

                    <strong>
                        ${escapeHtml(photo.filename)}
                    </strong>

                    <hr>

                    <b>Date:</b><br>
                    ${escapeHtml(photo.formattedDate)}

                    <br><br>

                    <b>Coordinates:</b><br>

                    ${photo.lat.toFixed(6)},
                    ${photo.lon.toFixed(6)}

                    <br><br>

                    <b>Camera:</b><br>

                    ${escapeHtml(photo.make)}
                    ${escapeHtml(photo.model)}

                    <br><br>

                    <img
                        src="${photo.src}"
                        style="
                            width:100%;
                            max-height:200px;
                            object-fit:cover;
                            border-radius:5px;
                        "
                    >

                </div>

            `);


                    marker.photoId =
                        photo.id;


                    markers.push(
                        marker
                    );

                }
            );


            /*
                Only one photo
            */

            if (
                sortedPhotos.length < 2
            ) {

                pathInfo.style.display =
                    "none";


                fitPhotoBounds();

                return;

            }


            /*
                Get coordinates
        
                OSRM requires:
        
                longitude,latitude
            */

            const coordinates =
                sortedPhotos
                    .map(
                        photo =>
                            `${photo.lon},${photo.lat}`
                    )
                    .join(";");


            /*
                OSRM request
            */

            const controller =
                new AbortController();


            /*
                10-second timeout
            */

            const timeout =
                setTimeout(
                    () => {

                        controller.abort();

                    },
                    10000
                );


            try {

                console.log(
                    "Requesting road route..."
                );


                const response =
                    await fetch(

                        `https://router.project-osrm.org/route/v1/driving/${coordinates}?overview=full&geometries=geojson`,

                        {
                            signal:
                                controller.signal
                        }

                    );


                clearTimeout(
                    timeout
                );


                if (!response.ok) {

                    throw new Error(
                        `HTTP error ${response.status}`
                    );

                }


                const data =
                    await response.json();


                if (
                    data.code !== "Ok"
                ) {

                    throw new Error(
                        "OSRM could not create a route."
                    );

                }


                /*
                    Convert:
        
                    [longitude, latitude]
        
                    to:
        
                    [latitude, longitude]
                */

                const routeCoordinates =
                    data.routes[0]
                        .geometry
                        .coordinates
                        .map(
                            coord => [
                                coord[1],
                                coord[0]
                            ]
                        );


                /*
                    Draw route
                */

                pathPolyline =
                    L.polyline(
                        routeCoordinates,
                        {

                            color:
                                "#4285F4",

                            weight:
                                5,

                            opacity:
                                0.75,

                            dashArray:
                                "10, 10"

                        }
                    )
                        .addTo(myMap);


                /*
                    Distance
                */

                totalDistance =
                    data.routes[0]
                        .distance / 1000;


                totalDistanceElement.textContent =
                    `${totalDistance.toFixed(2)} km (road distance)`;


                pathInfo.style.display =
                    "block";


                /*
                    Fit route
                */

                myMap.fitBounds(
                    pathPolyline.getBounds(),
                    {
                        padding:
                            [40, 40]
                    }
                );


                console.log(
                    `Route created: ${totalDistance.toFixed(2)} km`
                );


            } catch (error) {

                clearTimeout(
                    timeout
                );


                console.error(
                    "OSRM routing error:",
                    error
                );


                /*
                    FALLBACK
        
                    Draw straight line
                    if road routing fails.
                */

                const straightLineCoords =
                    sortedPhotos.map(
                        photo => [
                            photo.lat,
                            photo.lon
                        ]
                    );


                pathPolyline =
                    L.polyline(
                        straightLineCoords,
                        {

                            color:
                                "#dc3545",

                            weight:
                                3,

                            dashArray:
                                "5, 5"

                        }
                    )
                        .addTo(myMap);


                /*
                    Calculate straight-line
                    distance.
                */

                totalDistance =
                    calculateTotalDistance(
                        straightLineCoords
                    );


                totalDistanceElement.textContent =
                    `${totalDistance.toFixed(2)} km (straight-line distance)`;


                pathInfo.style.display =
                    "block";


                /*
                    Fit map
                */

                myMap.fitBounds(
                    pathPolyline.getBounds(),
                    {
                        padding:
                            [40, 40]
                    }
                );


                showStatus(
                    "Road routing was unavailable. A straight-line path was displayed instead.",
                    "warning"
                );

            }

        }


        /* ============================================================
           FIT PHOTO BOUNDS
        ============================================================ */

        function fitPhotoBounds() {

            if (
                photoData.length === 0
            ) {

                return;

            }


            const bounds =
                L.latLngBounds(
                    photoData.map(
                        photo => [
                            photo.lat,
                            photo.lon
                        ]
                    )
                );


            myMap.fitBounds(
                bounds,
                {
                    padding:
                        [40, 40]
                }
            );

        }


        /* ============================================================
           CALCULATE TOTAL STRAIGHT DISTANCE
        ============================================================ */

        function calculateTotalDistance(
            coords
        ) {

            let distance = 0;


            for (
                let i = 1;
                i < coords.length;
                i++
            ) {

                distance +=
                    calculateDistance(
                        coords[i - 1][0],
                        coords[i - 1][1],
                        coords[i][0],
                        coords[i][1]
                    );

            }


            return distance;

        }


        /* ============================================================
           HAVERSINE DISTANCE
        ============================================================ */

        function calculateDistance(
            lat1,
            lon1,
            lat2,
            lon2
        ) {

            const R =
                6371;


            const dLat =
                (
                    lat2 -
                    lat1
                )
                *
                Math.PI /
                180;


            const dLon =
                (
                    lon2 -
                    lon1
                )
                *
                Math.PI /
                180;


            const a =

                Math.sin(
                    dLat / 2
                )
                *
                Math.sin(
                    dLat / 2
                )

                +

                Math.cos(
                    lat1 *
                    Math.PI /
                    180
                )

                *

                Math.cos(
                    lat2 *
                    Math.PI /
                    180
                )

                *

                Math.sin(
                    dLon / 2
                )
                *
                Math.sin(
                    dLon / 2
                );


            const c =
                2 *
                Math.atan2(
                    Math.sqrt(a),
                    Math.sqrt(1 - a)
                );


            return R * c;

        }


        /* ============================================================
           TIME DIFFERENCES
        ============================================================ */

        function updateTimeDifferences() {

            if (
                photoData.length < 2
            ) {

                timeInfo.style.display =
                    "none";

                return;

            }


            /*
                Only photos with dates
            */

            const sortedPhotos =
                [...photoData]
                    .filter(
                        photo =>
                            photo.dateObj &&
                            !isNaN(
                                photo.dateObj.getTime()
                            )
                    )
                    .sort(
                        (a, b) =>
                            a.dateObj -
                            b.dateObj
                    );


            if (
                sortedPhotos.length < 2
            ) {

                timeInfo.style.display =
                    "none";

                return;

            }


            /*
                Total time
            */

            const firstDate =
                sortedPhotos[0].dateObj;


            const lastDate =
                sortedPhotos[
                    sortedPhotos.length - 1
                ].dateObj;


            const totalTime =
                formatTimeDifference(
                    firstDate,
                    lastDate
                );


            /*
                Consecutive times
            */

            const timeDiffs = [];


            for (
                let i = 1;
                i < sortedPhotos.length;
                i++
            ) {

                const difference =
                    formatTimeDifference(
                        sortedPhotos[i - 1].dateObj,
                        sortedPhotos[i].dateObj
                    );


                timeDiffs.push(
                    difference
                );

            }


            /*
                Display
            */

            timeDifferenceElement.innerHTML = `

        <div>

            <strong>Total:</strong>

            ${totalTime}

        </div>


        <div class="mt-1">

            <strong>Between photos:</strong>

            ${timeDiffs.join(", ")}

        </div>

    `;


            timeInfo.style.display =
                "block";

        }


        /* ============================================================
           FORMAT TIME DIFFERENCE
        ============================================================ */

        function formatTimeDifference(
            date1,
            date2
        ) {

            const diffMs =
                Math.abs(
                    date2 -
                    date1
                );


            const diffDays =
                Math.floor(
                    diffMs /
                    (
                        1000 *
                        60 *
                        60 *
                        24
                    )
                );


            const diffHours =
                Math.floor(

                    (
                        diffMs %
                        (
                            1000 *
                            60 *
                            60 *
                            24
                        )
                    )

                    /

                    (
                        1000 *
                        60 *
                        60
                    )

                );


            const diffMinutes =
                Math.floor(

                    (
                        diffMs %
                        (
                            1000 *
                            60 *
                            60
                        )
                    )

                    /

                    (
                        1000 *
                        60
                    )

                );


            const diffSeconds =
                Math.floor(

                    (
                        diffMs %
                        (
                            1000 *
                            60
                        )
                    )

                    /

                    1000

                );


            const parts = [];


            if (
                diffDays > 0
            ) {

                parts.push(
                    `${diffDays} day${diffDays !== 1 ? "s" : ""}`
                );

            }


            if (
                diffHours > 0
            ) {

                parts.push(
                    `${diffHours} hour${diffHours !== 1 ? "s" : ""}`
                );

            }


            if (
                diffMinutes > 0
            ) {

                parts.push(
                    `${diffMinutes} minute${diffMinutes !== 1 ? "s" : ""}`
                );

            }


            if (
                diffSeconds > 0 &&
                parts.length < 2
            ) {

                parts.push(
                    `${diffSeconds} second${diffSeconds !== 1 ? "s" : ""}`
                );

            }


            return (
                parts.join(" ")
                ||
                "less than a second"
            );

        }


        /* ============================================================
           CLEAR MAP
        ============================================================ */

        function clearMap() {

            /*
                Remove markers
            */

            markers.forEach(
                marker => {

                    myMap.removeLayer(
                        marker
                    );

                }
            );


            markers = [];


            /*
                Remove path
            */

            if (pathPolyline) {

                myMap.removeLayer(
                    pathPolyline
                );

                pathPolyline = null;

            }


            /*
                Reset data
            */

            photoData = [];

            totalDistance = 0;


            /*
                Reset UI
            */

            photoCards.innerHTML = `

        <div class="empty-gallery">

            <i class="bi bi-images fs-2"></i>

            <div class="mt-2">
                No photos uploaded
            </div>

        </div>

    `;


            photoCount.textContent =
                "0";


            pathInfo.style.display =
                "none";


            timeInfo.style.display =
                "none";


            imageInput.value =
                "";


            /*
                Reset map
            */

            myMap.setView(
                [8.3536, 124.8695],
                13
            );


            hideStatus();


            console.log(
                "Map cleared."
            );

        }


        /* ============================================================
           FIT BUTTON
        ============================================================ */

        document
            .getElementById("fitButton")
            .addEventListener(
                "click",
                function () {

                    fitPhotoBounds();

                }
            );


        /* ============================================================
           CLEAR BUTTON
        ============================================================ */

        document
            .getElementById("clearButton")
            .addEventListener(
                "click",
                function () {

                    clearMap();

                }
            );


        /* ============================================================
           STATUS MESSAGE
        ============================================================ */

        function showStatus(
            message,
            type
        ) {

            statusMessage.className =
                `alert alert-${type}`;


            statusMessage.textContent =
                message;


            statusMessage.classList.remove(
                "d-none"
            );

        }


        function hideStatus() {

            statusMessage.classList.add(
                "d-none"
            );

        }


        /* ============================================================
           ESCAPE HTML
        ============================================================ */

        function escapeHtml(
            value
        ) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* ============================================================
           INITIALIZE
        ============================================================ */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                initMap();

                console.log(
                    "EXIF Photo Plotter initialized successfully."
                );

            }
        );

    </script>
